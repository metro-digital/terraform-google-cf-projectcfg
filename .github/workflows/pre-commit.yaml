---
name: pre-commit

on:  # yamllint disable-line rule:truthy
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install terraform-docs
        env:
          TERRAFORM_DOCS_VERSION: '0.24.0'
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/terraform-docs.tgz"
          tar -xzf "${RUNNER_TEMP}/terraform-docs.tgz" -C "${RUNNER_TEMP}" terraform-docs
          sudo install "${RUNNER_TEMP}/terraform-docs" /usr/local/bin/terraform-docs

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: 'v0.61.0'
          cache: 'true'
          github_token: ${{ github.token }}

      - name: Install shell quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt

      - name: Install Trivy
        env:
          TRIVY_VERSION: '0.75.0'
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "${RUNNER_TEMP}/trivy.tgz"
          tar -xzf "${RUNNER_TEMP}/trivy.tgz" -C "${RUNNER_TEMP}" trivy
          sudo install "${RUNNER_TEMP}/trivy" /usr/local/bin/trivy

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
