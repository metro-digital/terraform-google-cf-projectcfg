---
name: Pipeline Status

on:  # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  actions: read
  checks: read
  statuses: read

jobs:
  pipeline-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure Success
        uses: DataDog/ensure-ci-success@v2
        with:
          initial-delay-seconds: 30
          max-retries: 20
          polling-interval-seconds: 20
          full-details-summary: true
