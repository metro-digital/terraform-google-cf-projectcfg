---
name: terraform-test-comment

on:  # yamllint disable-line rule:truthy
  workflow_run:
    workflows: ['terraform-test']
    types: [completed]

# This trusted workflow can comment on fork PRs. PR test jobs stay read-only.
# Never check out or execute the tested PR code or downloaded artifact contents.
permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Serialize comment updates, including completions from overlapping reruns.
    concurrency:
      group: terraform-test-pr-comments
      cancel-in-progress: false
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download results from the completed test run
        uses: actions/download-artifact@v8
        with:
          pattern: terraform-test-*
          path: ${{ runner.temp }}/terraform-test-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Create or update the PR test comment
        uses: actions/github-script@v8
        env:
          TEST_RESULTS_DIR: ${{ runner.temp }}/terraform-test-results
        with:
          script: |
            const publish = require('./.github/scripts/terraform-test-comment.cjs');
            await publish({ github, context, core });
